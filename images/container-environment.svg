<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Inside a running container</title>
  <desc id="desc">A container is an isolated process environment. Your analysis, read from the mounted repository, runs with Python, Python packages, system libraries, and tools supplied by the image. Below the container are the tooling that starts it, podman-hpc; the shared host Linux kernel, which provides isolation; and the host hardware. These are conceptual layers, not a call path.</desc>
  <rect width="960" height="600" rx="18" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
    <text x="480" y="39" font-size="26" font-weight="700" fill="#142d40">Inside a running container</text>
    <rect x="150" y="65" width="660" height="287" rx="18" fill="#eff8fa" stroke="#187c91" stroke-width="2"/>
    <text x="480" y="96" font-size="22" font-weight="700" fill="#146477">Container · isolated process environment</text>
    <rect x="175" y="112" width="610" height="75" rx="10" fill="#ffffff" stroke="#b6d7de"/>
    <text x="480" y="143" font-size="25" font-weight="700" fill="#142d40">Your analysis</text>
    <text x="480" y="171" font-size="20" fill="#34586c">Code read from your mounted repository</text>
    <rect x="175" y="201" width="610" height="130" rx="10" fill="#dceef2"/>
    <text x="480" y="228" font-size="19" font-weight="700" fill="#146477">SOFTWARE SUPPLIED BY THE IMAGE</text>
    <text x="480" y="266" font-size="24" fill="#142d40">Python + Python packages</text>
    <line x1="205" y1="281" x2="755" y2="281" stroke="#b6d7de"/>
    <text x="480" y="312" font-size="24" fill="#142d40">System libraries and tools</text>
    <rect x="150" y="367" width="660" height="58" rx="10" fill="#edf1f5"/>
    <text x="480" y="402" font-size="23" fill="#142d40">Container tooling: podman-hpc</text>
    <rect x="150" y="437" width="660" height="78" rx="10" fill="#f4eee4"/>
    <text x="480" y="468" font-size="23" font-weight="700" fill="#614b2b">Host Linux kernel (operating system)</text>
    <text x="480" y="497" font-size="20" fill="#614b2b">Shared with the host · provides isolation</text>
    <rect x="150" y="527" width="660" height="52" rx="10" fill="#edf1f5"/>
    <text x="480" y="560" font-size="23" fill="#142d40">Host hardware</text>
  </g>
</svg>
